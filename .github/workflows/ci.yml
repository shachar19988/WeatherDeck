name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Depth 2 so the build stamp can reach HEAD^2 — on a pull_request run
        # the checkout is a merge commit whose second parent is the branch head,
        # and at depth 1 that parent is not there to resolve.
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Depth 2 so the build stamp can reach HEAD^2 — on a pull_request run
        # the checkout is a merge commit whose second parent is the branch head,
        # and at depth 1 that parent is not there to resolve.
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      # Without this the APK is built and thrown away, which makes CI a
      # compile check and nothing else. Keeping it means a run page is also
      # where you go to put the build on a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: weatherdeck-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
