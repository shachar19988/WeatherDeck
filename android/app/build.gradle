apply plugin: 'com.android.application'

android {
    namespace 'com.weatherdeck.personal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.weatherdeck.personal'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.1.1'
    }

    sourceSets { main { assets.srcDirs = ['../../dist'] } }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
