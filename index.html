<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07171f" />
    <title>WeatherDeck</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        document.body.innerHTML = '<main style="padding:24px;color:white;background:#07171f;min-height:100vh;font-family:sans-serif"><h2>WeatherDeck could not start</h2><p style="color:#9db0b8">' + String(event.message || 'Unknown loading error') + '</p></main>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
